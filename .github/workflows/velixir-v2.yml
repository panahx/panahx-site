name: Deploy Panah X V2 to Velixir

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Velixir CLI
        run: |
          curl -fsSL https://velixir.net/install.sh | sh
          echo "$HOME/.velixir/bin" >> "$GITHUB_PATH"
          "$HOME/.velixir/bin/velixir" --version

      - name: Authenticate with Velixir
        env:
          VELIXIR_API_KEY: ${{ secrets.VELIXIR_PANAHX_V2_API_KEY }}
        run: |
          "$HOME/.velixir/bin/velixir" login --key "$VELIXIR_API_KEY"

      - name: Deploy Panah X
        run: |
          "$HOME/.velixir/bin/velixir" deploy \
            --app 1b79169a-00ad-4c75-babf-7998f7ce46c7

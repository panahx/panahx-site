name: Deploy to Velixir

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Velixir CLI
        run: |
          curl -fsSL https://velixir.net/install.sh | sh
          echo "$HOME/.velixir/bin" >> "$GITHUB_PATH"
          "$HOME/.velixir/bin/velixir" --version

      - name: Inspect Velixir CLI login
        run: |
          "$HOME/.velixir/bin/velixir" login --help

      - name: Deploy
        run: |
          "$HOME/.velixir/bin/velixir" deploy --app 9d026628-41fc-4394-93cf-743c050256ed

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Panah X - 곳이 세상을 만나다">
  <meta name="theme-color" content="#0a0a0f">
  <title>Panah X | به پناه خوش آمدید</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --bg-elevated: #0a0a12;
      --fg: #f0f0f5;
      --fg-muted: #888899;
      --accent: #00d4aa;
      --accent-glow: #00ffcc;
      --accent-dim: #006b55;
      --glass: rgba(18, 18, 28, 0.6);
      --glass-border: rgba(0, 212, 170, 0.15);
      --glass-highlight: rgba(0, 255, 204, 0.08);
      --shadow: rgba(0, 0, 0, 0.5);
      --shadow-glow: rgba(0, 212, 170, 0.3);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8f8fc;
        --bg-elevated: #ffffff;
        --fg: #1a1a2e;
        --fg-muted: #666677;
        --accent: #009678;
        --accent-glow: #00c9a0;
        --accent-dim: #005a45;
        --glass: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(0, 150, 120, 0.2);
        --glass-highlight: rgba(0, 201, 160, 0.1);
        --shadow: rgba(0, 0, 0, 0.1);
        --shadow-glow: rgba(0, 150, 120, 0.2);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Vazirmatn', 'Space Grotesk', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--bg);
    }

    #canvas-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 20%, rgba(0, 212, 170, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0, 150, 120, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 10% 90%, rgba(0, 212, 170, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    #canvas-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 170, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 170, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      pointer-events: none;
      z-index: 2;
      animation: gridMove 40s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    .content-layer {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .hero {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(2rem, 8vw, 4rem) clamp(1.5rem, 5vw, 3rem);
      gap: clamp(1.5rem, 4vw, 2.5rem);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .brand-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow), 0 0 24px var(--accent-glow);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.75rem, 2vw, 1.25rem);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeSlideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    .title-main {
      font-family: 'Vazirmatn', sans-serif;
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 50%, var(--fg) 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 6s ease-in-out infinite;
    }

    .title-brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
      opacity: 0.9;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .description {
      max-width: clamp(280px, 80vw, 520px);
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 300;
      line-height: 1.7;
      color: var(--fg-muted);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeSlideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    .description strong {
      color: var(--fg);
      font-weight: 500;
    }

    .tagline {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      font-weight: 400;
      color: var(--accent);
      opacity: 0.8;
      letter-spacing: 0.05em;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeSlideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
    }

    @keyframes fadeSlideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .cta-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: clamp(1rem, 3vw, 1.25rem) clamp(2rem, 6vw, 3rem);
      font-family: 'Vazirmatn', sans-serif;
      font-size: clamp(1rem, 3vw, 1.15rem);
      font-weight: 600;
      color: var(--bg);
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      animation: fadeSlideUp 1s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .cta-button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cta-button::after {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, var(--accent-glow), var(--accent), var(--accent-dim));
      border-radius: 18px;
      opacity: 0;
      filter: blur(20px);
      transition: opacity 0.3s ease;
      z-index: -1;
    }

    .cta-button:hover::before,
    .cta-button:focus-visible::before { opacity: 1; }
    .cta-button:hover::after,
    .cta-button:focus-visible::after { opacity: 0.6; }

    .cta-button:active {
      transform: scale(0.96);
      transition: transform 0.05s ease;
    }

    .cta-button:active::before { opacity: 1; }

    .cta-button .btn-glow {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
    }

    .cta-button.ripple .btn-glow {
      animation: ripple 0.6s ease-out forwards;
    }

    @keyframes ripple {
      0% { opacity: 1; transform: scale(0); }
      100% { opacity: 0; transform: scale(3); }
    }

    .cta-button .btn-text { position: relative; z-index: 1; }
    .cta-button .btn-arrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cta-button:hover .btn-arrow,
    .cta-button:focus-visible .btn-arrow { transform: translateX(4px); }

    .scroll-indicator {
      position: absolute;
      bottom: clamp(1.5rem, 4vh, 2.5rem);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      animation: fadeIn 1s ease 1.4s forwards;
      pointer-events: none;
    }

    .scroll-indicator svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent);
      animation: bounce 2s ease-in-out infinite;
    }

    .scroll-indicator span {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    footer {
      padding: clamp(1.5rem, 4vh, 2.5rem) clamp(1.5rem, 5vw, 3rem);
      text-align: center;
      opacity: 0;
      animation: fadeIn 1s ease 1.6s forwards;
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-brand {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--fg);
    }

    .footer-domain {
      font-size: clamp(0.8rem, 2.5vw, 0.95rem);
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .footer-copyright {
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      font-weight: 300;
      color: var(--fg-muted);
      opacity: 0.7;
    }

    .quality-badge {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--fg-muted);
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards;
    }

    .quality-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      animation: pulse 2s ease-in-out infinite;
    }

    @media (max-width: 480px) {
      .quality-badge { display: none; }
    }

    .reduced-motion *,
    .reduced-motion *::before,
    .reduced-motion *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      body { touch-action: auto; }
    }

    .low-performance .particles,
    .low-performance .grid-bg { display: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <main class="content-layer">
    <section class="hero" aria-labelledby="main-title">
      <div class="brand-badge" aria-label="نسخه آزمایشی">نسخه آزمایشی</div>

      <div class="title-group">
        <h1 id="main-title" class="title-main">به پناه خوش آمدید</h1>
        <div class="title-brand">PANAH X</div>
      </div>

      <p class="description">
        اینجا آغاز دنیای <strong>پناه</strong> است؛<br>
        ساده، زیبا و برای آینده ساخته شده.
      </p>

      <p class="tagline">یک تجربه‌ی جدید در دنیای فناوری</p>

      <button class="cta-button" id="cta-btn" aria-label="ورود به پناه">
        <span class="btn-glow"></span>
        <span class="btn-text">ورود به پناه</span>
        <svg class="btn-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

      <div class="scroll-indicator" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M19 12l-7 7-7-7"/>
        </svg>
        <span>اسکرول کنید</span>
      </div>
    </section>

    <footer>
      <div class="footer-content">
        <div class="footer-brand">Panah X</div>
        <div class="footer-domain">panahx.ir</div>
        <div class="footer-copyright">ساخته‌شده توسط امیر زارع • <span id="year"></span></div>
      </div>
    </footer>
  </main>

  <div class="quality-badge" aria-label="حالت عملکرد">
    <span class="dot"></span>
    <span id="perf-label">Auto</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
